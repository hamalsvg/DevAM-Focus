name: DevAM Focus Daily AI Reels Generator

on:
  schedule:
    # Her gün UTC 05:45 (Türkiye saati 08:45)
    - cron: '45 5 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-publish-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: FFmpeg, Edge-TTS ve Sharp Kurulumu
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg jq
          pipx install edge-tts || python3 -m pip install edge-tts --break-system-packages || true
          npm install sharp --no-audit --no-fund

      - name: Günlük Senaryo ve Seslendirme Metnini Hazırla
        run: node scripts/generate-daily-reel.js init

      - name: Türkçe Yapay Zeka Sesini Üret, Süresini Ölç ve Tam Süreli MP4 Birleştir
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if command -v edge-tts >/dev/null 2>&1; then
            edge-tts --voice tr-TR-AhmetNeural --rate="+2%" --file reel_build/tts.txt --write-media reel_build/voice.mp3 || true
          else
            python3 -m edge_tts --voice tr-TR-AhmetNeural --rate="+2%" --file reel_build/tts.txt --write-media reel_build/voice.mp3 || true
          fi

          # Ses dosyasının tam süresini saniye cinsinden ölç (+2 sn bitiş payı ekle)
          if [ -s "reel_build/voice.mp3" ]; then
            RAW_DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 reel_build/voice.mp3)
            TARGET_SEC=$(python3 -c "import math; print(max(18, int(math.ceil(float('${RAW_DUR:-24}'))) + 2))")
          else
            TARGET_SEC=24
          fi

          echo "Ölçülen tam video süresi: ${TARGET_SEC} saniye"
          node scripts/generate-daily-reel.js render "$TARGET_SEC"

          if [ -s "reel_build/voice.mp3" ]; then
            ffmpeg -y \
              -framerate 1 -i reel_build/frame_%02d.png \
              -i reel_build/voice.mp3 \
              -i reel_build/ocean_bg.wav \
              -filter_complex "[1:a]volume=1.0,apad=pad_dur=2[v];[2:a]volume=0.16[bg];[v][bg]amix=inputs=2:duration=first:dropout_transition=2[aout]" \
              -map 0:v -map "[aout]" \
              -t "$TARGET_SEC" \
              -c:v libx264 -r 30 -pix_fmt yuv420p \
              -c:a aac -b:a 192k \
              reel_build/devam_focus_reel.mp4
          else
            ffmpeg -y \
              -framerate 1 -i reel_build/frame_%02d.png \
              -i reel_build/ocean_bg.wav \
              -t "$TARGET_SEC" \
              -c:v libx264 -r 30 -pix_fmt yuv420p \
              -c:a aac -b:a 192k \
              reel_build/devam_focus_reel.mp4
          fi

      - name: Üretilen MP4 Videosunu GitHub Artifacts Olarak Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: gunluk-reels-videosu
          path: reel_build/devam_focus_reel.mp4

      - name: MP4 Videosunu Discord Kanalına Gönder
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ] && [ -f "reel_build/devam_focus_reel.mp4" ]; then
            CAPTION=$(cat reel_build/caption.txt)
            curl -F "payload_json={\"username\":\"DevAM Focus • Video Otomasyonu\",\"content\":$(jq -Rs . <<< "$CAPTION")}" \
                 -F "file=@reel_build/devam_focus_reel.mp4" \
                 "$DISCORD_WEBHOOK_URL"
          fi

      - name: YouTube Shorts ve Instagram Reels Olarak Otomatik Yayınla
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -f "scripts/upload-shorts-reels.js" ]; then
            node scripts/upload-shorts-reels.js
          else
            echo "UYARI: scripts/upload-shorts-reels.js dosyasi bulunamadi!"
          fi
